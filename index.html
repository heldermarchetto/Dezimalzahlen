<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dezimalzahlen: Rechnen lernen und üben (Mathematik Klasse 6, DFU)</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#22303c; --mut:#6b7785; --line:#e2d9c8;
  --acc:#1f6f78; --acc2:#f2a900; --ok:#2f9e44; --okbg:#e6f6ea; --err:#c92a2a; --errbg:#fdecec;
  --k:#1c6fd1; --ms:#d6336c; --wh:#2f9e44; --mp:#e8590c; --par:#7048e8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
#top{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#top .brand{font-weight:700;font-size:1.1rem;cursor:pointer;margin-right:auto;display:flex;align-items:center;gap:.4rem}
#top .pill{background:rgba(255,255,255,.16);border-radius:99px;padding:.2rem .7rem;font-size:.92rem;white-space:nowrap}
#top .pill.star{background:#fff;color:#7a5200;font-weight:700}
#top button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:.2rem .7rem;cursor:pointer;font-size:.9rem}
main{max-width:1120px;margin:0 auto;padding:1rem .9rem 4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 1px 3px rgba(60,40,0,.06)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:.65rem 1.1rem;font-weight:600;cursor:pointer;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn.small{min-height:38px;padding:.35rem .8rem;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)} .en{color:var(--mut);font-style:italic;font-size:.92em}
.crumb{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.crumb h2{margin:0}
/* Login */
.login{max-width:560px;margin:1.5rem auto}
.login label{display:block;font-weight:600;margin:.9rem 0 .25rem}
.login input,.login select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:1.05rem}
.login input:focus{outline:none;border-color:var(--acc)}
/* Home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem}
.st{cursor:pointer;display:flex;gap:.9rem;align-items:flex-start;transition:transform .12s}
.st:hover{transform:translateY(-2px)}
.st .ico{font-size:2rem;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:#eaf3f3;flex:none}
.st h3{margin:0}
.bar{height:9px;border-radius:9px;background:#ece4d4;overflow:hidden;margin-top:.5rem}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:9px}
.stars{letter-spacing:1px;font-size:1.05rem}
.stars .off{filter:grayscale(1);opacity:.28}
.tasklist{display:grid;gap:.6rem}
.task{display:flex;align-items:center;gap:.8rem;cursor:pointer}
.task .n{width:38px;height:38px;border-radius:50%;background:#eaf3f3;display:grid;place-items:center;font-weight:700;flex:none}
.task.done .n{background:#fff3cd}
.task .go{margin-left:auto;color:var(--acc);font-weight:700}
.hero{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.hero .big{font-size:2.2rem;font-weight:800;color:#7a5200}
/* Layout for board tasks */
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:1rem;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.board{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{display:grid;gap:.7rem}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem}
.merk{background:#fff8e1;border:2px solid var(--acc2);border-radius:12px;padding:.7rem .85rem}
.merk b.t{display:block;color:#7a5200;margin-bottom:.15rem}
.fb{min-height:1.2rem;border-radius:12px;padding:.6rem .8rem;font-weight:600}
.fb:empty{padding:0}
.fb.ok{background:var(--okbg);color:#1b6b2f}
.fb.err{background:var(--errbg);color:var(--err)}
.fb.info{background:#e8f1f8;color:#1d4f73}
.read{display:grid;gap:.35rem}
.read div{display:flex;justify-content:space-between;background:#f3efe6;border-radius:10px;padding:.4rem .7rem;font-variant-numeric:tabular-nums}
.read div b{font-size:1.1rem}
.read.good div{background:var(--okbg);color:#1b6b2f}
.dots{display:flex;gap:.3rem;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);display:block}
.dots i.on{background:var(--acc)}
ol.steps{margin:0;padding-left:1.4rem;display:grid;gap:.35rem}
ol.steps li{padding:.3rem .5rem;border-radius:8px;color:var(--mut)}
ol.steps li.cur{background:#e8f1f8;color:var(--ink);font-weight:600}
ol.steps li.fin::marker{color:var(--ok)}
.ctl{display:grid;gap:.5rem}
.slid{display:flex;align-items:center;gap:.5rem}
.slid input[type=range]{flex:1;height:38px}
.slid .pm{width:44px;height:44px;border-radius:50%;border:2px solid var(--acc);background:#fff;color:var(--acc);font-weight:800;font-size:1.2rem;cursor:pointer}
.val{font-weight:800;font-size:1.25rem;text-align:center;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.65rem .8rem;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--acc)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--errbg);border-color:var(--err);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q{font-weight:700;font-size:1.1rem;margin-bottom:.5rem}
/* Glossary */
.gl{border-bottom:2px dotted var(--acc);cursor:help}
#pop{position:fixed;z-index:50;background:#22303c;color:#fff;padding:.4rem .7rem;border-radius:10px;font-size:.95rem;max-width:260px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:60;background:#fff3cd;border:2px solid var(--acc2);color:#7a5200;font-weight:800;font-size:1.2rem;padding:.6rem 1.2rem;border-radius:99px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.show{display:block;animation:pop .5s}
@keyframes pop{0%{transform:translateX(-50%) scale(.5)}60%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
.donebox{margin-top:1rem;border:2px solid var(--acc2);background:#fffaf0}
/* Words */
.flash{max-width:560px;margin:0 auto;text-align:center}
.flash .w{font-size:1.8rem;font-weight:800}
.flash svg,.pic svg{width:200px;height:150px;max-width:100%}
.art-der{color:#1c6fd1}.art-die{color:#d6336c}.art-das{color:#2f9e44}
.tiles{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;min-height:54px}
.tile{background:#fff;border:2px solid var(--acc);border-radius:10px;padding:.5rem .8rem;font-weight:700;cursor:pointer;font-size:1.1rem;min-height:46px}
.tile.used{opacity:.25;pointer-events:none}
.build{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:.5rem;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;align-items:center;background:#fff;font-size:1.2rem;font-weight:700}
.inp{width:100%;max-width:460px;padding:.7rem .8rem;border:2px solid var(--line);border-radius:12px;font-size:1.3rem;text-align:center;background:#fff;letter-spacing:.5px}
.inp:focus{outline:none;border-color:var(--acc)}
.mask{font:700 1.7rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px}
.center{text-align:center;display:grid;gap:.8rem;justify-items:center}
.prog{font-size:.92rem;color:var(--mut)}
.sort{display:grid;gap:.4rem}
.sort .it{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.45rem .6rem}
.sort .it span{flex:1}
.sort .it button{width:40px;height:40px;border-radius:10px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-weight:800;cursor:pointer}
.sort .it.right{border-color:var(--ok);background:var(--okbg)}
.sort .it.wrong{border-color:var(--err);background:var(--errbg)}
select.gap{font-weight:700;border:2px solid var(--acc);border-radius:8px;padding:.2rem .3rem;background:#fff;margin:.15rem 0}
select.gap.right{border-color:var(--ok);background:var(--okbg)} select.gap.wrong{border-color:var(--err);background:var(--errbg)}
.gaptext{line-height:2.3}
/* SVG board styles (1 cm = 100 units) */
.board .g1{stroke:#dfe7ee;stroke-width:1.5} .board .g2{stroke:#eef3f7;stroke-width:1}
.board line,.board circle,.board path,.board polyline,.board polygon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.board .giv{stroke:#22303c;stroke-width:5}
.board .aux{stroke:#8793a0;stroke-width:3;stroke-dasharray:14 12}
.board .thin{stroke:#8793a0;stroke-width:3}
.board .k{stroke:var(--k);stroke-width:5} .board .ms{stroke:var(--ms);stroke-width:5}
.board .wh{stroke:var(--wh);stroke-width:5} .board .mp{stroke:var(--mp);stroke-width:5}
.board .par{stroke:var(--par);stroke-width:5}
.board .tri{stroke:#22303c;stroke-width:6;fill:rgba(242,169,0,.18)}
.board .sol{stroke:var(--acc2);stroke-width:16;opacity:.75}
.board .fillk{fill:rgba(28,111,209,.12);stroke:none}
.board .pv{stroke:var(--acc);stroke-width:4;stroke-dasharray:10 10}
.board .dot{fill:#22303c;stroke:#fff;stroke-width:3}
.board .dot.open{fill:#fff;stroke:#22303c;stroke-width:5}
.board .dot.sol{fill:var(--acc2);stroke:#7a5200;stroke-width:4;opacity:1}
.board .dot.mk{fill:var(--ok);stroke:#fff;stroke-width:3}
.board .dot.q{fill:#fff;stroke:var(--acc);stroke-width:5}
.board text{font:600 38px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#22303c;stroke:none;paint-order:stroke}
.board text.h{stroke:#fff;stroke-width:9px}
.board text.c-k{fill:var(--k)} .board text.c-ms{fill:var(--ms)} .board text.c-wh{fill:var(--wh)} .board text.c-mp{fill:var(--mp)} .board text.c-par{fill:var(--par)} .board text.c-acc{fill:var(--acc)}
.board .hot{fill:rgba(31,111,120,.001);stroke:rgba(31,111,120,.35);stroke-width:4;stroke-dasharray:10 9;cursor:pointer}
.board .hot:hover{fill:rgba(31,111,120,.12)}
.board .handle{fill:var(--acc2);stroke:#7a5200;stroke-width:5;cursor:grab}
.board .anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cert{text-align:center;border:3px double var(--acc2)}
.hud{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.55rem .8rem}
.pill2{background:#f3efe6;border-radius:99px;padding:.15rem .65rem;font-weight:700;font-size:.92rem;white-space:nowrap}
.pill2.bad{background:var(--errbg);color:var(--err)} .pill2.fire{background:#fff3cd;color:#a14b00}
.dotsrow i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:3px;vertical-align:middle} .dotsrow i.g{background:var(--ok)} .dotsrow i.r{background:var(--err)}
.item{animation:fadein .25s} @keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.again{margin-top:.35rem;font-weight:500;font-size:.92rem}
.narrow{max-width:680px;margin:0 auto;display:grid;gap:.7rem}
.rowopts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stmt{display:inline-block;margin-top:.3rem;font-size:1.25rem;background:#f3efe6;border-radius:10px;padding:.2rem .7rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:.45rem .85rem;font-weight:600;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--acc);background:#dff0f1;color:var(--acc)}
.chip.right{border-color:var(--ok);background:var(--okbg);color:#1b6b2f} .chip.wrong{border-color:var(--err);background:var(--errbg);color:var(--err);text-decoration:line-through} .chip.miss{border-color:var(--acc2);background:#fff3cd;color:#7a5200}
.big{font-size:1.9rem;font-weight:800} .bigstars .stars{font-size:2.6rem;letter-spacing:6px}
.weak{margin-top:1rem;display:grid;gap:.5rem;border-color:var(--acc2)}
.word{text-align:center;font:800 3rem "Arial","Helvetica",sans-serif;letter-spacing:.12em;color:var(--ink)}
.word span{display:inline-block} .word.mir{color:var(--ms)} .word.ms span{transform:scaleX(-1)} .word.mw span{transform:scaleY(-1)}
.heftcard{display:grid;gap:.7rem;font-size:1.05rem}
ol.instr{margin:.35rem 0 0;padding-left:1.4rem;display:grid;gap:.4rem}
.shot img{max-width:100%;max-height:420px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto}
.inp{font-size:1.2rem}
/* Karopapier */
.board.karo{background:#fff}
.board .kg{stroke:#cfe0ee;stroke-width:1.2}
.board.tappable{cursor:pointer}
.board .kl{stroke:#22303c;stroke-width:3;fill:none;stroke-linecap:round}
.board .kl.thick{stroke-width:4.5}
.board .kl.c1{stroke:#1c6fd1} .board .kl.c2{stroke:#d6336c}
.board .kl.axis{stroke:#e03131;stroke-width:3;stroke-dasharray:12 7}
.board .kl.res{stroke:var(--ok);stroke-width:4}
.board .kl.ghost{stroke:var(--ok);stroke-width:3;stroke-dasharray:8 7}
.board .kl.wrongline{stroke:var(--err);stroke-width:3;stroke-dasharray:6 6}
.board .kl.help{stroke:#8793a0;stroke-width:2;stroke-dasharray:6 6}
.board .kl.hl1{stroke:var(--acc2);stroke-width:9;opacity:.75} .board .kl.hl2{stroke:#7048e8;stroke-width:9;opacity:.6}
.board .kp{stroke-width:3.5;stroke-linejoin:round}
.board .kp.c1{stroke:#1c6fd1;fill:rgba(28,111,209,.10)} .board .kp.c2{stroke:#d6336c;fill:rgba(214,51,108,.12)}
.board .kd{fill:#22303c;stroke:#fff;stroke-width:2.5}
.board .kd.acc{fill:var(--acc)} .board .kd.c2{fill:#d6336c} .board .kd.ok{fill:var(--ok)} .board .kd.z{fill:#e8590c}
.board .kt{font:700 22px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#22303c;stroke:#fff;stroke-width:6px;paint-order:stroke}
.board .kt.c-c1{fill:#1c6fd1} .board .kt.c-c2{fill:#d6336c} .board .kt.c-axis{fill:#e03131} .board .kt.c-acc{fill:var(--acc)} .board .kt.c-ok{fill:var(--ok)} .board .kt.c-z{fill:#e8590c}
.board .kra path{fill:none;stroke:#22303c;stroke-width:2} .board .kra circle{fill:#22303c}
.board .ghostra path{stroke:var(--ok)} .board .ghostra circle{fill:var(--ok)}
.board .kring{fill:rgba(31,111,120,.12);stroke:var(--acc);stroke-width:3}
.board .kring.bad{fill:rgba(201,42,42,.18);stroke:var(--err)}
.board .kring.sol,.board .kring.cur{fill:rgba(242,169,0,.3);stroke:var(--acc2);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.board .anim2{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw2 1s forwards} @keyframes draw2{to{stroke-dashoffset:0}}
.board.plainb{background:#fff;max-width:300px;margin:0 auto}
.board .letter{font:700 220px Arial,Helvetica,sans-serif;fill:#1c6fd1}
.board .letax{stroke:#e03131;stroke-width:4;stroke-dasharray:14 9}
.ghostrot{opacity:.55;transition:transform 1.4s ease;transform-box:view-box}
.ghostrot.go{transform:rotate(180deg)}
.ghostrot text,.ghostrot polygon,.ghostrot circle{fill:rgba(214,51,108,.35)!important;stroke:#d6336c!important}
/* Dezimalzahlen */
.bar.goal{position:relative}
.bar.goal b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--acc2);border-radius:2px}
.legend{margin:.8rem 0;font-size:.98rem;border-color:var(--acc2)}
.lvl{display:inline-block;font-size:.8rem;font-weight:700;border-radius:99px;padding:0 .5rem;background:#eef2f6;color:#4a5866;vertical-align:middle}
.lvl.hard{background:#fde8e8;color:#a61b1b}
.hardnote{background:#fff3cd;border:1px solid #f0d58a;color:#6b4a00;border-radius:12px;padding:.5rem .8rem;margin-bottom:.7rem}
.task.k-learn{border-left:6px solid var(--acc)} .task.k-test{border-left:6px solid var(--acc2)} .task.k-heft{border-left:6px solid #d6336c}
.exprrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.expr{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.inp.ans{font-size:1.5rem;width:9rem;text-align:center;font-weight:700}
.inp.right{border-color:var(--ok);background:var(--okbg)} .inp.wrong{border-color:var(--err);background:var(--errbg)}
.pm{font-size:1.3rem;min-width:46px}
.stmtbig{font-size:1.5rem;font-weight:700;background:#f7f4ec;border-radius:12px;padding:.5rem .9rem;display:inline-block;line-height:1.5}
.prebox{overflow-x:auto}
.solbox{margin-top:.5rem;background:#fff;border-radius:10px;padding:.4rem;display:inline-block}
.chain{font-size:1.3rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.chain span{color:var(--mut);font-size:1.05rem}
.frac{font-size:1.5em}
.ov{text-decoration:overline}
table.kg{border-collapse:collapse;margin:.5rem 0;background:#fff;font:600 1.25rem "Courier New",monospace;
  background-image:linear-gradient(#cfe0ee 1px,transparent 1px),linear-gradient(90deg,#cfe0ee 1px,transparent 1px);background-size:30px 30px}
table.kg td{width:30px;height:30px;padding:0;text-align:center;position:relative;color:#1d2b3a}
table.kg td .cm{position:absolute;right:-4px;bottom:-2px;font-style:normal;font-weight:800;color:#1d2b3a}
table.kg tr.u td{border-bottom:2.5px solid #1d2b3a}
table.kg tr.carry td{font-size:.85rem;color:#d6336c;height:18px;vertical-align:top}
table.kg tr.res td{color:#1c6fd1}
.opt table.kg{margin:0 auto}
.lnav{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.ldot{border:2px solid var(--line);background:#fff;border-radius:12px;padding:.25rem .5rem;min-width:52px;cursor:pointer;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ldot small{font-size:.75rem;color:var(--mut)}
.ldot.on{border-color:var(--acc);background:#dff0f1}
.ldot.done{background:var(--okbg);border-color:var(--ok)}
.ldot.must{border-color:var(--err);box-shadow:0 0 0 2px var(--errbg)}
.lcard{font-size:1.07rem;line-height:1.55}
.lcard h3{margin-top:0}
.ltext table.tbl{margin:.5rem 0}
.pflicht{background:var(--errbg);color:#8a1c1c;border-radius:10px;padding:.5rem .8rem;margin-bottom:.6rem}
.heftbox{background:#fff;border:2px solid #b8cbe0;border-radius:10px;padding:.8rem 1rem;line-height:1.7;margin:.6rem 0;
  background-image:linear-gradient(#e3edf7 1px,transparent 1px),linear-gradient(90deg,#e3edf7 1px,transparent 1px);background-size:22px 22px}
.rules{background:#fff8e1;border:1px solid #f0d58a;border-radius:10px;padding:.5rem .8rem;margin:.4rem 0;font-size:.98rem}
.fotocard{margin-top:.6rem}
.heftcard{display:grid;gap:.6rem}
.shot img{max-width:100%;max-height:420px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto}
.chk{display:flex;gap:.55rem;align-items:flex-start;padding:.3rem 0;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:.15rem;accent-color:var(--acc)}
/* Zeichnen */
.phases{display:flex;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
.ph{flex:1;min-width:150px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:.55rem;font-weight:700;cursor:pointer;min-height:46px}
.ph.on{border-color:var(--acc);background:var(--acc);color:#fff}
.ph.ok::after{content:' ✅'}
.ph[disabled]{opacity:.4;cursor:default}
.two.draw{grid-template-columns:minmax(0,1.9fr) minmax(260px,1fr)}
@media(max-width:900px){.two.draw{grid-template-columns:1fr}}

<body>

<script>
'use strict';
/* =====================================================================
   EINSTELLUNGEN FÜR DIE LEHRKRAFT
   Die Seite arbeitet mit dem „Fortschritt-Server“ (Google Sheet + Code.gs).
   Die Server-ID kommt normalerweise aus dem Link:  ...?u=7a-03&s=<Server-ID>
   (so stehen die Links auf den Zugangskarten / QR-Codes).
   SERVER_ID : optional fest eintragen (Teil der Web-App-URL zwischen /s/ und /exec).
               Ohne Server-ID wird nur auf dem Gerät gespeichert.
   APP_ID    : Name der Seite im Sheet (Blatt „📊 <APP_ID>“ und Zeile in „Seiten“).
   ===================================================================== */
const CONFIG = {
  SERVER_ID: '',
  APP_ID: 'k6-dezimalzahlen',
  TITEL: 'Rechnen mit Dezimalzahlen (Mathematik 6)'
};
const QS = new URLSearchParams(location.search);
const SERVER_ID = (QS.get('s') || CONFIG.SERVER_ID || '').replace(/[^A-Za-z0-9_-]/g, '');
const SERVER_URL = SERVER_ID ? 'https://script.google.com/macros/s/' + SERVER_ID + '/exec' : '';
const PAGE_LINK = /^https:/.test(location.href) ? location.origin + location.pathname : '';

/* ---------- kleine Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (typeof props === 'string') e.innerHTML = props;
  else if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'html') e.innerHTML = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);

  for (const k of kids) if (k) e.append(k);

}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const num = v => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1).replace('.', ','));
const cm = v => num(v) + '&nbsp;cm';
const f1 = v => v.toFixed(1).replace('.', ',');

/* ---------- Glossar (Deutsch -> Englisch als Hilfe) ---------- */
const GLOSS = {
  'Dezimalzahlen': 'decimal numbers', 'Dezimalzahl': 'decimal number', 'Nachkommastellen': 'decimal places', 'Nachkommastelle': 'decimal place', 'Komma': 'decimal point (comma)',
  'Übertrag': 'carry', 'untereinander': 'one below the other', 'Überschlag': 'estimate', 'Faktoren': 'factors', 'Produkt': 'product', 'Quotient': 'quotient', 'Teilprodukt': 'partial product', 'Teilprodukte': 'partial products',
  'Zehnerpotenz': 'power of ten', 'Zehnerpotenzen': 'powers of ten', 'Vorzeichen': 'sign (+ or −)', 'periodische': 'recurring', 'periodisch': 'recurring', 'abbrechende': 'terminating', 'abbrechend': 'terminating', 'Periode': 'repeating digits',
  'Klammer': 'bracket', 'Minusklammer': 'bracket with a minus in front', 'vertauschen': 'swap', 'Ausklammern': 'factorising', 'Ausmultiplizieren': 'expanding', 'Punkt vor Strich': 'multiply/divide before add/subtract',
  'Arbeitsheft': 'workbook', 'Heft': 'exercise book', 'ordentlich': 'neatly', 'Merksatz': 'rule to remember', 'Probe': 'check (inverse calculation)', 'auffüllen': 'fill up', 'Bruch': 'fraction', 'Zähler': 'numerator', 'Nenner': 'denominator'
};
const GLRE = new RegExp('(^|[^A-Za-zÄÖÜäöüß])(' + Object.keys(GLOSS).sort((a, b) => b.length - a.length).join('|') + ')(?![A-Za-zÄÖÜäöüß])', 'g');
/* T(): markiert Fachwörter im Text. Antippen zeigt die englische Bedeutung. */
function T(html) {
  return String(html).split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p : p.replace(GLRE, (m, pre, w) => `${pre}<span class="gl" data-en="${GLOSS[w]}">${w}</span>`)).join('');
}
document.addEventListener('click', e => {
  const pop = $('#pop'), g = e.target.closest && e.target.closest('.gl');
  if (!g) { pop.style.display = 'none'; return; }
  pop.textContent = '🇬🇧 ' + g.dataset.en; pop.style.display = 'block';
  const r = g.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(window.innerWidth - pop.offsetWidth - 8, r.left)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
});
window.addEventListener('scroll', () => { $('#pop').style.display = 'none'; }, true);
function speak(text) {
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { }
}

/* ---------- Zustand, Speichern, Google Sheet ---------- */
let ST = null;               // {user:{u,pin,name,klasse}, stars:{}, err:0, errs:{}, sec:0, fotos:{}}
let CUR = null;              // aktuelle Aufgabe (für die Fehlerzählung pro Aufgabe)
const LS = 'k6_dezimal_v1';
const userKey = u => LS + ':' + String(u.u).toLowerCase();
function totalStars() { return Object.keys(ST.stars).length; }
function maxStars() { return STATIONS.reduce((s, x) => s + x.tasks.reduce((t, y) => t + (y.stars || 1), 0), 0); }
function stationStars(st) { return st.tasks.reduce((s, t) => s + starsOf(t), 0); }
function starsOf(t) { const n = t.stars || 1; let c = 0; for (let i = 1; i <= n; i++) if (ST.stars[n === 1 ? t.id : t.id + '.' + i]) c++; return c; }
function saveLocal() {
  try { localStorage.setItem(userKey(ST.user), JSON.stringify(ST)); localStorage.setItem(LS + ':last', JSON.stringify(ST.user)); } catch (e) { }
}
let dirty = false, syncT = null, syncing = false;
function save() { saveLocal(); dirty = true; clearTimeout(syncT); syncT = setTimeout(sync, 1500); header(); }
const taskMax = t => t.stars || 1;
function summary() {
  const tasks = {}, fotos = [], extra = {}; let done = 0, n = 0;
  STATIONS.forEach(st => st.tasks.forEach(t => {
    const mx = taskMax(t), got = starsOf(t), e = (ST.errs || {})[t.id] || 0;
    n++; if (got >= mx) done++;
    tasks[t.id] = [got, mx, e, got, mx, t.id, st.title + ': ' + t.title];
    if (t.kind === 'learn') t.steps.forEach(s => { if (s.key) fotos.push(s.key); });
    if (t.kind === 'heft') fotos.push(t.id);
    if (t.kind === 'test') { const r = (ST.tests || {})[t.id]; extra['v' + t.id] = ['Test ' + st.title + ': Versuche', r ? `${r.n}× · beste ${r.best}/8 · letzte ${r.last}/8` : '–']; }
  }));
  extra.heft = ['✏️ Pflicht-Heft-Einträge', fotos.filter(k => k.includes('-H') && ST.fotos[k]).length + ' von ' + fotos.filter(k => k.includes('-H')).length];
  extra.fotos = ['📷 Fotos gesamt', fotos.filter(k => ST.fotos[k]).length + ' von ' + fotos.length];
  extra.min = ['Minuten', String(Math.round((ST.sec || 0) / 60))];
  return { stars: totalStars(), max: maxStars(), err: ST.err || 0, done, n, tasks, extra, fotos };
}
function payload() {
  return { action: 'save', u: ST.user.u, p: ST.user.pin, app: CONFIG.APP_ID, titel: CONFIG.TITEL, link: PAGE_LINK, t: Date.now(),
    state: { stars: ST.stars, err: ST.err, errs: ST.errs, sec: ST.sec, fotos: ST.fotos, tests: ST.tests }, sum: summary() };
}
async function api(data) {
  const r = await fetch(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data), redirect: 'follow' });
  return await r.json();
}
function cloud(state) {
  const c = $('#cloud'); if (!ST) { c.hidden = true; return; } c.hidden = false;
  c.textContent = { off: '💾 nur auf diesem Gerät', ok: '☁️ gespeichert', busy: '☁️ speichert …', err: '⚠️ offline – wird später gespeichert' }[state];
}
async function sync() {
  if (!ST || !SERVER_URL) { cloud('off'); return; }
  if (syncing || !dirty) return;
  syncing = true; dirty = false; cloud('busy');
  try { const r = await api(payload()); if (r && r.ok) cloud('ok'); else throw new Error(r && r.err); }
  catch (e) { dirty = true; cloud('err'); }
  syncing = false;
  if (dirty) { clearTimeout(syncT); syncT = setTimeout(sync, 20000); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && ST) {
    saveLocal();
    if (SERVER_URL && dirty) try { if (navigator.sendBeacon(SERVER_URL, new Blob([JSON.stringify(payload())], { type: 'text/plain;charset=utf-8' }))) dirty = false; } catch (e) { }
  }
});
setInterval(() => { if (ST && document.visibilityState === 'visible') { ST.sec = (ST.sec || 0) + 10; if (ST.sec % 60 === 0) { saveLocal(); dirty = true; if (ST.sec % 300 === 0) sync(); } } }, 10000);

function miss() { if (ST) { ST.err = (ST.err || 0) + 1; if (CUR) { ST.errs = ST.errs || {}; ST.errs[CUR] = (ST.errs[CUR] || 0) + 1; } saveLocal(); dirty = true; } }
function award(id) {
  if (ST.stars[id]) return false;
  ST.stars[id] = 1; save();
  const t = $('#toast'); t.textContent = '⭐ +1 Stern!'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
  return true;
}
function header() {
  const on = !!ST;
  for (const id of ['who', 'starcount', 'logout', 'cloud']) $('#' + id).hidden = !on;
  if (on) { $('#who').textContent = ST.user.name + (ST.user.klasse ? ' · ' + ST.user.klasse : ''); $('#starcount').textContent = '⭐ ' + totalStars() + ' / ' + maxStars(); if (!SERVER_URL) cloud('off'); }
}

/* ---------- Anmeldung ---------- */
function showLogin(msg) {
  ST = null; CUR = null; header();
  const main = $('#main'); main.innerHTML = '';
  let last = null; try { last = JSON.parse(localStorage.getItem(LS + ':last')); } catch (e) { }
  const name = el('input', { id: 'ln', placeholder: SERVER_URL ? 'z. B. 7a-03' : 'dein Name', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
  const pin = el('input', { id: 'lp', placeholder: '4 Ziffern', inputmode: 'numeric', maxlength: '8', autocomplete: 'off' });
  name.value = QS.get('u') || (last ? last.u : '');
  const fb = el('div', { class: 'fb' + (msg ? ' err' : ''), html: msg || '' });
  const go = el('button', { class: 'btn', html: 'Los geht’s! →' });
  const card = el('div', { class: 'card login' },
    el('h1', '🔢 Rechnen mit Dezimalzahlen'),
    el('p', 'Hier lernst und übst du das <b>Rechnen mit Dezimalzahlen</b>: Addieren, Subtrahieren, Multiplizieren und Dividieren. In jedem Kapitel: erst <b>📖 lernen</b>, dann <b>✏️ üben</b>, dann ein <b>kleiner Test</b>. Du sammelst Sterne ⭐.<br><span class="en">Learn and practise calculating with decimals. Learn first, then practise, then a short test.</span>'),
    el('label', SERVER_URL ? 'Benutzername <span class="en">(username – see your card)</span>' : 'Name <span class="en">(your name)</span>'), name,
    el('label', 'PIN <span class="en">(' + (SERVER_URL ? 'see your card' : 'choose 4 digits and remember them') + ')</span>'), pin,
    el('div', { style: 'height:.9rem' }), fb, el('div', { style: 'height:.6rem' }), go,
    el('p', { class: 'mut', style: 'font-size:.9rem;margin-bottom:0', html: 'Tipp: Unterstrichene Wörter kannst du antippen. Dann siehst du das Wort auf Englisch. 🇬🇧' + (SERVER_URL ? '' : '<br>Hinweis: Diese Seite ist nicht mit dem Server verbunden. Deine Sterne bleiben nur auf diesem Gerät.') }));
  main.append(card);
  const bad = h => { ST = null; go.disabled = false; fb.className = 'fb err'; fb.innerHTML = h; };
  async function submit() {
    const u = { u: name.value.trim().toLowerCase().replace(/\s+/g, SERVER_URL ? '' : ' '), pin: pin.value.trim(), name: name.value.trim(), klasse: '' };
    if (u.u.length < 2) return bad(SERVER_URL ? 'Bitte schreibe deinen Benutzernamen.' : 'Bitte schreibe deinen Namen.');
    if (!/^\d{3,8}$/.test(u.pin)) return bad('Bitte schreibe deine PIN (nur Ziffern).');
    let local = null; try { local = JSON.parse(localStorage.getItem(userKey(u))); } catch (e) { }
    if (!SERVER_URL && local && local.user && local.user.pin !== u.pin) return bad('Die PIN ist falsch.');
    ST = { user: u, stars: {}, err: 0, errs: {}, sec: 0, fotos: {}, tests: {} };
    if (local && local.user && local.user.pin === u.pin) { Object.assign(ST, local); ST.user = Object.assign({}, local.user, { pin: u.pin }); ST.fotos = ST.fotos || {}; ST.tests = ST.tests || {}; }

      let r = null;
      try { r = await api({ action: 'login', u: u.u, p: u.pin, app: CONFIG.APP_ID, titel: CONFIG.TITEL, link: PAGE_LINK }); } catch (e) { r = null; }
      if (r && r.ok === false) {
        return bad({ login: 'Benutzername oder PIN ist falsch. <span class="en">(Wrong username or PIN.)</span>', gesperrt: 'Zu viele falsche Versuche. Warte 10 Minuten und frage deine Lehrkraft.', klasse: 'Diese Seite ist für deine Klasse noch nicht freigeschaltet. Frage deine Lehrkraft.' }[r.err] || 'Der Server meldet einen Fehler. Versuche es noch einmal.');
      }
      if (r && r.ok) {
        ST.user.name = r.voll || r.name || u.u; ST.user.klasse = r.klasse || '';
        const d = r.data && r.data.state;
        if (d) { Object.assign(ST.stars, d.stars || {}); ST.err = Math.max(ST.err || 0, d.err || 0); ST.sec = Math.max(ST.sec || 0, d.sec || 0); ST.tests = ST.tests || {}; for (const k in (d.tests || {})) { const a = ST.tests[k], b = d.tests[k]; if (!a || b.n > a.n) ST.tests[k] = b; } for (const k in (d.errs || {})) ST.errs[k] = Math.max(ST.errs[k] || 0, d.errs[k]); for (const k in (d.fotos || {})) if (!ST.fotos[k] || (d.fotos[k].t || 0) > (ST.fotos[k].t || 0)) ST.fotos[k] = d.fotos[k]; }
        cloud('ok');

        if (!(local && local.user && local.user.pin === u.pin)) return bad('Keine Verbindung zum Server. Prüfe das Internet und versuche es noch einmal.');
        cloud('err');
      }
      dirty = true;
    }
    saveLocal(); header(); showHome(); if (SERVER_URL) { sync(); retryFotos(); }
  }
  go.addEventListener('click', submit);
  pin.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

/* ---------- Übersicht ---------- */
function starRow(n, of) { let s = ''; for (let i = 0; i < of; i++) s += `<span class="${i < n ? '' : 'off'}">⭐</span>`; return `<span class="stars">${s}</span>`; }
function showHome() {

  window.scrollTo(0, 0);
  const main = $('#main'); main.innerHTML = '';
  const tot = totalStars(), mx = maxStars();
  const hero = el('div', { class: 'card hero' },

  main.append(el('div', { class: 'card legend', html: T('<b>So funktioniert es:</b> Jedes Kapitel hat <b>📖 Lernen</b> (mit Pflicht-Einträgen ✏️ ins Arbeitsheft), <b>Übungen</b> und einen <b>kleinen Test</b>. Den Test kannst du so oft wiederholen, wie du willst.<br><b>Schwierigkeit:</b> 🟢 leicht · 🟡 mittel · 🔴 schwer. <b>Die schweren Aufgaben sind wirklich schwer. Es ist völlig in Ordnung, wenn du sie nicht schaffst!</b> Niemand muss 100 % erreichen – <b>80 % der Sterne sind ein super Ergebnis.</b>') }));
  main.append(hero);
  const grid = el('div', { class: 'grid' });
  STATIONS.forEach((st, i) => {
    const n = stationStars(st), of = st.tasks.reduce((t, y) => t + (y.stars || 1), 0);

      el('div', { class: 'ico', html: st.icon }),
      el('div', { style: 'flex:1' }, el('h3', `Kapitel ${i + 1}: ${st.title}`), el('div', { class: 'mut', html: st.sub }), el('div', { class: 'mut', style: 'font-size:.95rem', html: `⭐ ${n} / ${of}` + (must ? ` · <span style="color:var(--err)">✏️ ${must} Heft-Eintrag${must > 1 ? 'e' : ''} fehlt</span>` : ' · ✏️ ✅') }))));
  });

  if (weak.length) main.append(el('div', { class: 'card weak' }, el('h3', '🎯 Hier übst du am besten noch einmal'), el('div', { class: 'mut', html: 'Hier hattest du die meisten Fehler. Aus Fehlern lernt man – versuche es noch einmal!' }),
    ...weak.map(x => el('button', { class: 'opt', html: `${x.s.icon} <b>${x.t.title}</b> <span class="mut">(${x.s.title})</span> – <span style="color:var(--err)">❌ ${x.e} Fehler</span> · ${starRow(starsOf(x.t), x.t.stars || 1)}`, onclick: () => runTask(x.s.id, x.t.id) }))));
  main.append(el('p', { class: 'mut', style: 'margin-top:1.2rem', html: SERVER_URL ? 'Deine Sterne, Fehler, Tests und Fotos werden automatisch gespeichert. Deine Lehrkraft kann sie sehen.' : 'Deine Sterne werden auf diesem Gerät gespeichert.' }));
}
const LVL = { 1: '<span class="lvl">🟢 leicht</span>', 2: '<span class="lvl">🟡 mittel</span>', 3: '<span class="lvl hard">🔴 schwer</span>' };
function taskStatus(t) {
  if (t.kind === 'learn') { const ks = t.steps.filter(s => s.key), ok = ks.filter(s => ST.fotos[s.key]).length; return `<div style="font-size:.9rem;${ok < ks.length ? 'color:var(--err)' : 'color:var(--ok)'}">✏️ Pflicht-Heft-Einträge: ${ok} / ${ks.length} ${ok < ks.length ? '– bitte noch erledigen!' : '✅'}</div>`; }
  if (t.kind === 'test') { const r = (ST.tests || {})[t.id]; return `<div class="mut" style="font-size:.9rem">${r ? `🔁 ${r.n}× gemacht · Bestwert ${r.best}/8 · zuletzt ${r.last}/8` : 'Noch nicht gemacht'}</div>`; }
  const e = (ST.errs || {})[t.id] || 0, f = t.foto ? `📷 Foto ${ST.fotos[t.id] ? '✅' : pendGet()[t.id] ? '⏳' : '– fehlt'} · ` : '';

}
function showStation(sid) {
  CUR = null;
  window.scrollTo(0, 0);

function itFind(o) {   // o = {pre, type, a, expl, st, again, opts}
  return { st: o.st, again: o.again, sol: 'Lösung: ' + ERR[o.type] + (o.type === 'ok' ? '' : '. Richtig: ' + fmt(o.a)),
    show(box, R) {
      const c = el('div', { class: 'narrow' }); box.append(c);
      c.append(el('div', { class: 'q', html: T(o.q || '🔍 <b>Finde den Fehler.</b> Was wurde falsch gemacht?') }), el('div', { class: 'prebox', html: o.pre }));
      const keys = shuffle(o.opts || ['komma', 'uebertrag', 'nks', 'ok']);
      const list = el('div', { class: 'opts rowopts' }); let lock = false;
      keys.forEach(k => {
        const b = el('button', { class: 'opt', html: ERR[k] }); b._ok = k === o.type; list.append(b);
        b.addEventListener('click', () => {
          if (lock) return; lock = true;
          if (k === o.type) { b.classList.add('right'); step2(true); }
          else { b.classList.add('wrong'); [...list.children].forEach(x => { if (x._ok) x.classList.add('right'); }); step2(false); }
        });
      });
      c.append(list);
      function step2(ok1) {
        if (o.type === 'ok') { ok1 ? R.right(o.expl || 'Die Rechnung stimmt.') : R.wrong((o.expl || '') + ' Die Rechnung ist richtig.', true); return; }
        if (!ok1) { R.wrong(o.expl + '<br>Richtig ist: <b>' + fmt(o.a) + '</b>', true); return; }
        R.info('✅ Richtig erkannt! ' + o.expl + '<br>Wie lautet das <b>richtige</b> Ergebnis?');
        const inp = el('input', { class: 'inp ans', inputmode: 'decimal', placeholder: '?' }), go = el('button', { class: 'btn', html: 'Prüfen ✓' });
        c.insertBefore(el('div', { class: 'exprrow' }, el('span', { class: 'expr', html: 'Richtiges Ergebnis:' }), inp, signBtn(inp), go), c.querySelector('.fb'));
        let t = 0, over = false;
        const chk = () => { if (over) return; const v = parseDE(inp.value); if (isNaN(v)) return; if (same(v, o.a)) { over = true; R.right('Richtig korrigiert: ' + fmt(o.a)); } else { t++; if (t >= 2 || R.exam) { over = true; R.wrong('Richtig ist: <b>' + fmt(o.a) + '</b>', true); } else R.wrong('Das richtige Ergebnis ist noch nicht dabei. Rechne noch einmal.', false); } };
        go.addEventListener('click', chk); inp.addEventListener('keydown', e => { if (e.key === 'Enter') chk(); }); setTimeout(() => inp.focus(), 50);
      }
      R.mount(c);
    } };
}
/* Richtig oder falsch? Wenn falsch: richtiges Ergebnis eingeben */
function itWFfix(o) {   // o = {stmt, ok(boolean), a (richtiger Wert), expl, st, again}
  return { st: o.st, again: o.again, sol: o.ok ? 'Lösung: richtig.' : 'Lösung: falsch – richtig ist ' + fmt(o.a),
    show(box, R) {
      const c = el('div', { class: 'narrow' }); box.append(c);
      c.append(el('div', { class: 'q', html: '🔍 Hier wurde gerechnet. <b>Stimmt das?</b>' }), el('div', { class: 'stmtbig', html: o.stmt }));
      const list = el('div', { class: 'opts rowopts' }); let lock = false;
      [['✔ richtig', true], ['✘ falsch', false]].forEach(([t, v]) => {
        const b = el('button', { class: 'opt', html: t }); b._ok = v === o.ok; list.append(b);
        b.addEventListener('click', () => {
          if (lock) return; lock = true;
          if (v !== o.ok) { b.classList.add('wrong'); [...list.children].forEach(x => { if (x._ok) x.classList.add('right'); }); R.wrong(o.expl + (o.ok ? '' : '<br>Richtig ist: <b>' + fmt(o.a) + '</b>'), true); return; }
          b.classList.add('right');
          if (o.ok) { R.right(o.expl); return; }
          R.info('✅ Richtig erkannt: Das ist falsch! Wie lautet das richtige Ergebnis?');
          const inp = el('input', { class: 'inp ans', inputmode: 'decimal', placeholder: '?' }), go = el('button', { class: 'btn', html: 'Prüfen ✓' });
          c.insertBefore(el('div', { class: 'exprrow' }, el('span', { class: 'expr', html: 'Richtig:' }), inp, signBtn(inp), go), c.querySelector('.fb'));
          let t = 0, over = false;
          const chk = () => { if (over) return; const val = parseDE(inp.value); if (isNaN(val)) return; if (same(val, o.a)) { over = true; R.right(o.expl); } else { t++; if (t >= 2 || R.exam) { over = true; R.wrong(o.expl + '<br>Richtig ist: <b>' + fmt(o.a) + '</b>', true); } else R.wrong('Noch nicht. Rechne noch einmal.', false); } };
          go.addEventListener('click', chk); inp.addEventListener('keydown', e => { if (e.key === 'Enter') chk(); }); setTimeout(() => inp.focus(), 50);
        });
      });
      c.append(list); R.mount(c);
    } };
}

/* =====================================================================
   1 · ADDIEREN UND SUBTRAHIEREN
   ===================================================================== */
const SA = 'Addieren und Subtrahieren';
function genAddKopf() {
  const a = dec(1, 0.1, 20), b = dec(1, 0.1, 10), plus = Math.random() < .5;
  const [x, y] = plus ? [a, b] : [Math.max(a, b), Math.min(a, b)];
  const r = plus ? x + y : x - y;
  return itNum({ st: SA, again: genAddKopf, q: `${fmt(x)} ${plus ? '+' : '−'} ${fmt(y)}`, a: R9(r), hint: 'Rechne erst die Zehntel, dann die Ganzen.' });
}
function genAddSchr() {
  const ka = rint(1, 3), kb = rint(1, 4), a = dec(ka, 0.05, 150), b = dec(kb === ka ? (kb % 4) + 1 : kb, 0.01, 60), plus = Math.random() < .55;
  const [x, y] = plus ? [a, b] : [Math.max(a, b), Math.min(a, b)], r = R9(plus ? x + y : x - y);
  return itNum({ st: SA, again: genAddSchr, q: `${fmt(x)} ${plus ? '+' : '−'} ${fmt(y)}`, a: r, hint: 'Schreibe die Zahlen so untereinander, dass <b>Komma unter Komma</b> steht. Fülle fehlende Stellen mit Nullen auf.', sol: kgrid(addLines(x, y, plus ? '+' : '−', r, { fill: true })) });
}
function genAddNeg() {
  const a = dec(rint(1, 2), 0.1, 30), b = dec(rint(1, 2), 0.1, 30), f = rint(0, 4);
  const forms = [[`−${fmt(a)} + ${fmt(b)}`, -a + b], [`${fmt(Math.min(a, b))} − ${fmt(Math.max(a, b))}`, Math.min(a, b) - Math.max(a, b)], [`−${fmt(a)} − ${fmt(b)}`, -a - b], [`${fmt(a)} + (−${fmt(b)})`, a - b], [`−${fmt(a)} − (−${fmt(b)})`, -a + b]];
  const [q, r] = forms[f];
  return itNum({ st: SA, again: genAddNeg, q, a: R9(r), hint: v => (Math.sign(v) !== Math.sign(r) ? 'Achte auf das <b>Vorzeichen</b>: Bestimme es zuerst. ' : '') + 'Tipp: + (− …) heißt minus, − (− …) heißt plus.' });
}
function genAddFind() {
  const type = pick(['komma', 'uebertrag', 'uebertrag', 'ok', 'vorz']);
  if (type === 'vorz') {
    const a = dec(1, 2, 9), b = dec(1, 0.5, a - 0.5), r = R9(-a + b);
    return itFind({ st: SA, again: genAddFind, type, a: r, opts: ['komma', 'uebertrag', 'vorz', 'ok'], pre: `<div class="stmtbig">−${fmt(a)} + ${fmt(b)} = ${fmt(-r)}</div>`, expl: `${fmt(a)} ist größer als ${fmt(b)}. Deshalb bekommt das Ergebnis das Vorzeichen der Zahl −${fmt(a)}: also <b>minus</b>.` });
  }
  for (let n = 0; n < 200; n++) {
    const a = dec(rint(1, 2), 1, 99), b = dec(rint(3, 4), 1, 20), plus = Math.random() < .6;
    const [x, y] = plus ? [a, b] : [Math.max(a, b), Math.min(a, b)], op = plus ? '+' : '−', r = R9(plus ? x + y : x - y);
    if (type === 'ok') return itFind({ st: SA, again: genAddFind, type, a: r, pre: kgrid(addLines(x, y, op, r, { fill: true })), expl: 'Komma unter Komma, Überträge beachtet – alles richtig.' });
    if (type === 'komma') {
      if (dp(x) === dp(y)) continue;
      const k = Math.max(dp(x), dp(y)), X = Math.round(x * 10 ** dp(x)), Y = Math.round(y * 10 ** dp(y)), W = plus ? X + Y : X - Y;
      if (W <= 0) continue;
      const shown = fmt(W / 10 ** dp(x));   // Komma wie beim oberen Faktor
      return itFind({ st: SA, again: genAddFind, type, a: r, pre: kgrid(addLines(x, y, op, r, { right: true, shown: shown.replace(/^0,/, '0,') })), expl: 'Die Zahlen stehen rechtsbündig. Es muss aber <b>Komma unter Komma</b> stehen!' });
    }
    // Übertrag vergessen: eine Stelle mit Übertrag ist im Ergebnis um 1 falsch
    const k = Math.max(dp(x), dp(y)), X = Math.round(x * 10 ** k), Y = Math.round(y * 10 ** k);
    const col = [...Array(String(Math.max(X, Y)).length).keys()].find(i => { const dx = Math.floor(X / 10 ** i) % 10, dy = Math.floor(Y / 10 ** i) % 10; return plus ? dx + dy >= 10 : dx < dy; });
    if (col == null) continue;
    const wrong = R9(r + (plus ? -1 : 1) * 10 ** (col + 1 - k));
    if (wrong <= 0) continue;
    return itFind({ st: SA, again: genAddFind, type: 'uebertrag', a: r, pre: kgrid(addLines(x, y, op, r, { fill: true, shown: fmt(wrong) })), expl: plus ? 'Bei einer Stelle wurde der <b>Übertrag</b> nicht dazugezählt.' : 'Beim Subtrahieren wurde ein <b>Übertrag</b> (Entbündeln) vergessen.' });
  }
  return genAddFind();
}
const ADD_KNOBEL = [

function genVorteil() {

    if (f === 2) { const a = dec(2, 5, 15), b = dec(1, 1, 9), c = R9(Math.round(a + 0.5) - a); if (c <= 0) continue; return itNum({ st: SB, again: genVorteil, q: `${fmt(a)} − ${fmt(b)} + ${fmt(c)}`, a: R9(a - b + c), hint: `Vertausche: ${fmt(a)} + ${fmt(c)} = ${fmt(a + c)}.` }); }

}
function genKlammer() {

const SD = 'Multiplizieren';
function genMulKopf() {
  const a = rint(1, 12) / 10 ** rint(0, 2), b = rint(2, 9) / 10 ** rint(1, 2);
  return itNum({ st: SD, again: genMulKopf, q: `${fmt(a)} · ${fmt(b)}`, a: R9(a * b), hint: `Rechne ohne Komma und zähle die Nachkommastellen: ${dp(a)} + ${dp(b)} = ${dp(a) + dp(b)}.` });
}
function genMulKomma() {
  const a = dec(rint(1, 2), 0.1, 40), b = dec(rint(1, 3), 0.01, 9), A = Math.round(a * 10 ** dp(a)), B = Math.round(b * 10 ** dp(b)), r = R9(a * b);
  return itNum({ st: SD, again: genMulKomma, intro: 'Hier fehlt im Ergebnis das <b>Komma</b>. Schreibe das Ergebnis mit Komma.', pre: `<div class="stmtbig">${fmt(a)} · ${fmt(b)} = ${String(A * B).padStart(dp(a) + dp(b) + 1, '0')}</div>`, q: `${fmt(a)} · ${fmt(b)}`, a: r, hint: `Zähle die Nachkommastellen: ${dp(a)} + ${dp(b)} = ${dp(a) + dp(b)}. So viele Stellen hat das Ergebnis nach dem Komma.` });
}
function genMulSchr() {
  const a = dec(rint(1, 2), 1, 60), b = dec(rint(1, 2), 0.1, 9), r = R9(a * b), ue = Math.round(a) * Math.max(1, Math.round(b));
  return itNum({ st: SD, again: genMulSchr, intro: `Überschlage zuerst im Kopf (≈ ${fmt(Math.round(a))} · ${fmt(Math.round(b) || 1)}). Rechne dann schriftlich.`, q: `${fmt(a)} · ${fmt(b)}`, a: r, hint: v => (Math.abs(v / r) > 5 || Math.abs(v / r) < .2 ? `Dein Ergebnis passt nicht zum Überschlag (≈ ${fmt(ue)}). Prüfe das Komma! ` : '') + `Das Ergebnis hat ${dp(a) + dp(b)} Nachkommastellen.`, sol: kgrid(mulLines(a, b).lines) });
}
function genMulFind() {
  const t = rint(0, 2);
  if (t === 0) {   // schriftlich mit Fehler
    for (let n = 0; n < 50; n++) {
      const a = dec(rint(1, 2), 1, 50), b = dec(1, 1.1, 9.9), r = R9(a * b), type = pick(['nks', 'nks', 'shift', 'ok']);
      if (String(Math.round(b * 10)).length < 2) continue;
      const M = type === 'nks' ? mulLines(a, b, { k: dp(a) + dp(b) + pick([-1, 1]) }) : type === 'shift' ? mulLines(a, b, { noShift: true }) : mulLines(a, b);
      if (type === 'nks' && (dp(a) + dp(b) - 1 < 0)) continue;
      return itFind({ st: SD, again: genMulFind, type, a: r, opts: ['nks', 'shift', 'komma', 'ok'], pre: kgrid(M.lines), expl: type === 'nks' ? `Das Ergebnis muss ${dp(a) + dp(b)} Nachkommastellen haben (${dp(a)} + ${dp(b)}).` : type === 'shift' ? 'Das zweite Teilprodukt muss eine Stelle weiter nach rechts eingerückt werden.' : 'Teilprodukte und Komma stimmen.' });
    }
  }
  const a = rint(2, 12) / 10, b = rint(2, 9) / 10 ** rint(1, 2), r = R9(a * b), wt = rint(0, 2), ok = Math.random() < .3;
  const wrong = wt === 0 ? R9(r * 10) : wt === 1 ? R9(r / 10) : R9(a + b);
  return itWFfix({ st: SD, again: genMulFind, ok, a: r, stmt: `${fmt(a)} · ${fmt(b)} = ${fmt(ok ? r : wrong)}`, expl: `${fmt(a)} hat ${dp(a)}, ${fmt(b)} hat ${dp(b)} Nachkommastelle(n). Das Ergebnis hat also ${dp(a) + dp(b)}: ${fmt(r)}.` });
}

const SF = 'Dividieren von Dezimalzahlen';
function shiftPair(a, b) { const k = dp(b); return [R9(a * 10 ** k), R9(b * 10 ** k), k]; }
function genShift() {
  const b = dec(rint(1, 3), 0.01, 3), q = dec(rint(0, 1), 1, 40), a = R9(q * b), [A, B, k] = shiftPair(a, b);
  const wrong = [`${fmt(a)} : ${fmt(B)}`, `${fmt(R9(a / 10 ** k))} : ${fmt(B)}`, `${fmt(R9(A * 10))} : ${fmt(R9(B * 10))}`].filter((x, i, arr) => arr.indexOf(x) === i && x !== `${fmt(A)} : ${fmt(B)}`);
  return itMC({ st: SF, again: genShift, q: `Verschiebe das Komma bei beiden Zahlen gleich, bis du durch eine <b>ganze Zahl</b> teilst. Welche Aufgabe entsteht?<div class="stmtbig">${fmt(a)} : ${fmt(b)}</div>`, right: `${fmt(A)} : ${fmt(B)}`, wrong, row: false, expl: `${fmt(b)} hat ${k} Nachkommastelle(n). Beide Kommas wandern ${k} Stelle(n) nach rechts: ${fmt(A)} : ${fmt(B)}.` });
}
function genDecKopf() { const b = pick([0.2, 0.4, 0.5, 0.7, 0.8, 0.9, 0.04, 0.05, 0.03, 1.2, 0.6]), q = pick([2, 3, 4, 5, 6, 7, 8, 9, 0.5, 1.5, 20, 30]), a = R9(q * b); return itNum({ st: SF, again: genDecKopf, q: `${fmt(a)} : ${fmt(b)}`, a: q, hint: `Verschiebe beide Kommas um ${dp(b)} Stelle(n): ${fmt(R9(a * 10 ** dp(b)))} : ${fmt(R9(b * 10 ** dp(b)))}.` }); }
function genDecSchr() { const b = dec(1, 0.3, 2.5), q = dec(rint(1, 2), 1, 30), a = R9(q * b), [A, B] = shiftPair(a, b); return itNum({ st: SF, again: genDecSchr, q: `${fmt(a)} : ${fmt(b)}`, a: q, hint: `Erst Kommas verschieben: ${fmt(A)} : ${fmt(B)}. Dann schriftlich teilen.` }); }
function genDecFind() {
  const b = pick([0.06, 0.6, 1.2, 0.02, 0.4, 0.5, 0.3]), q = pick([8, 1.2, 5, 6.2, 0.4, 70, 3.5]), a = R9(q * b), ok = Math.random() < .3, wrong = Math.random() < .5 ? R9(q / 10) : R9(q * 10);
  return itWFfix({ st: SF, again: genDecFind, ok, a: q, stmt: `${fmt(a)} : ${fmt(b)} = ${fmt(ok ? q : wrong)}`, expl: `Kommas gleich verschieben: ${fmt(R9(a * 10 ** dp(b)))} : ${fmt(R9(b * 10 ** dp(b)))} = ${fmt(q)}. Probe: ${fmt(q)} · ${fmt(b)} = ${fmt(a)}.` });
}

/* =====================================================================

const SG = 'Verbindung der Rechenarten';
function genPunkt() {
  const f = rint(0, 3), a = dec(1, 0.2, 5), b = rint(2, 9), c = dec(1, 0.5, 9), d = dec(1, 0.2, 2);
  const F = [[`${fmt(a)} · ${b} − ${fmt(c)}`, a * b - c, `${fmt(R9(a * b))} − ${fmt(c)}`], [`${fmt(c)} − ${fmt(a)} · ${b}`, c - a * b, `${fmt(c)} − ${fmt(R9(a * b))}`], [`${fmt(a)} · ${b} + ${fmt(d)} · 10`, a * b + d * 10, `${fmt(R9(a * b))} + ${fmt(R9(d * 10))}`], [`${fmt(R9(a * b))} : ${b} + ${fmt(c)}`, a + c, `${fmt(a)} + ${fmt(c)}`]][f];
  return itNum({ st: SG, again: genPunkt, q: F[0], a: R9(F[1]), hint: `<b>Punkt vor Strich!</b> ${F[0]} = ${F[2]}` });
}

  () => { const x = dec(1, 1, 9); return itNum({ st: SG, again: GESCHICKT[1], q: `0,2 · ${fmt(x)} · 50`, a: R9(x * 10), hint: `Vertauschen: 0,2 · 50 = 10. Also 10 · ${fmt(x)}.` }); },

/* Stern für ein Foto, das später gesendet wurde */
function fotoStar(key) {
  for (const st of STATIONS) for (const t of st.tasks) {
    if (t.kind === 'learn') { const s = t.steps.find(x => x.key === key); if (s) return s.star; }
